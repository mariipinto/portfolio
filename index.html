<!DOCTYPE html>
<html lang="pt-BR" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Mariana Pinto — Product Designer</title>
<meta id="meta-description" name="description" content="Product Designer especialista em SaaS B2B, Design Systems e Discovery de produto. Baseada em Recife, Brasil.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" href="favicon-32.png">
<meta property="og:type" content="website">
<meta id="og-title" property="og:title" content="Mariana Pinto — Product Designer">
<meta id="og-description" property="og:description" content="Product Designer especialista em SaaS B2B, Design Systems e Discovery de produto.">
<meta property="og:image" content="og-cover.png">
<meta id="og-locale" property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">
<meta id="twitter-title" name="twitter:title" content="Mariana Pinto — Product Designer">
<meta id="twitter-description" name="twitter:description" content="Product Designer especialista em SaaS B2B, Design Systems e Discovery de produto.">
<meta name="twitter:image" content="og-cover.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Bodoni+Moda:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="theme.js"></script>
</head>
<body>

<div class="hero-card">
  <div class="grain"></div>
  <header class="site" id="site-header">
    <div class="wrap">
      <a href="index.html" class="brand" id="brand-name">[nome]</a>
      <nav class="links">
        <a href="#cases" class="navlink" id="nav-cases">cases</a>
        <a href="#sobre" class="navlink" id="nav-sobre">sobre</a>
        <a href="#contato" class="navlink" id="nav-contato">contato</a>
        <a href="#" id="resume-link" class="navlink" target="_blank">currículo</a>
        <button id="lang-toggle" aria-label="Mudar idioma">PT / EN</button>
        <button id="theme-toggle" aria-label="Alternar tema">
          <span class="dot"></span><span id="theme-label">light</span>
        </button>
        <button id="nav-toggle" aria-label="Abrir menu" aria-expanded="false">☰</button>
      </nav>
    </div>
    <div class="nav-mobile-panel">
      <a href="#cases" class="navlink" id="nav-cases-mobile">cases</a>
      <a href="#sobre" class="navlink" id="nav-sobre-mobile">sobre</a>
      <a href="#contato" class="navlink" id="nav-contato-mobile">contato</a>
      <a href="#" id="resume-link-mobile" class="navlink" target="_blank">currículo</a>
    </div>
  </header>

  <section class="hero wrap">
    <h1 id="hero-headline">[preencher: headline]</h1>
    <div class="hero-bio">
      <p><b id="hero-currently"></b></p>
      <p><b id="hero-delivering"></b></p>
      <p><b id="hero-status"></b></p>
    </div>
    <div class="btn-row">
      <a href="#cases" class="btn-pill">
        <span class="btn-circle">↘</span>
        <span class="btn-circle-label" id="hero-cta-label">Ver cases</span>
      </a>
      <a href="#" id="hero-linkedin" class="linkedin-badge" target="_blank" aria-label="LinkedIn">in</a>
    </div>
  </section>
</div>

<main>

  <section class="block" id="sobre">
    <div class="wrap">
      <p class="label-mono" id="sobre-eyebrow">sobre</p>
      <h2 id="about-headline">[preencher]</h2>
      <div class="about-grid">
        <div class="col-text" id="about-paragraphs"></div>
        <div class="col-principles" id="about-principles"></div>
      </div>
    </div>
  </section>

  <section class="block" id="cases">
    <div class="wrap">
      <p class="label-mono" id="cases-eyebrow">cases</p>
      <h2 id="cases-headline">[preencher]</h2>
      <div id="case-list" class="case-list-v2" style="margin-top: 40px;"></div>
    </div>
  </section>

  <section class="block" id="contato">
    <div class="wrap">
      <p class="label-mono" id="contato-eyebrow">contato</p>
      <h2 id="contact-headline">[preencher]</h2>
      <div class="contact-row">
        <a href="#" id="contact-email" class="btn-pill">
          <span class="btn-circle">↗</span>
          <span class="btn-circle-label" id="contact-email-label">[preencher: e-mail]</span>
        </a>
        <a href="#" id="contact-whatsapp" class="whatsapp-badge" target="_blank" aria-label="WhatsApp">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.87 9.87 0 0 0 12.04 2zm0 18.15h-.01a8.2 8.2 0 0 1-4.18-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.22 8.22 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24 2.2 0 4.27.86 5.83 2.42a8.17 8.17 0 0 1 2.41 5.83c0 4.55-3.7 8.23-8.25 8.23zm4.52-6.16c-.25-.12-1.47-.72-1.7-.81-.23-.08-.4-.12-.56.13-.17.24-.64.8-.79.97-.14.16-.29.18-.54.06-.25-.12-1.04-.38-1.98-1.22-.73-.65-1.23-1.46-1.37-1.7-.14-.25-.01-.38.11-.5.11-.11.25-.29.37-.43.12-.15.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.13-.56-1.35-.77-1.84-.2-.49-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.22.25-.87.85-.87 2.06 0 1.22.89 2.4 1.02 2.56.12.17 1.75 2.68 4.25 3.75.59.26 1.05.41 1.42.52.6.19 1.14.16 1.57.1.48-.07 1.47-.6 1.68-1.18.2-.58.2-1.08.15-1.18-.06-.11-.23-.17-.48-.29z"/></svg>
        </a>
        <a href="#" id="contact-linkedin" class="linkedin-badge" target="_blank" aria-label="LinkedIn">in</a>
      </div>
    </div>
  </section>
</main>

<footer class="site">
  <div class="wrap">
    <p class="label-mono" id="footer-name">© <span id="footer-year"></span> [nome]</p>
    <p class="label-mono" id="footer-local">Recife, Brasil</p>
  </div>
</footer>

<script src="data.js"></script>
<script>
function getLang() {
  try { return localStorage.getItem("lang") || "pt"; } catch (e) { return "pt"; }
}
function setLang(lang) {
  try { localStorage.setItem("lang", lang); } catch (e) {}
}

function render(lang) {
  const T = I18N[lang];
  document.getElementById("html-root").lang = lang === "pt" ? "pt-BR" : "en";
  document.getElementById("lang-toggle").textContent = lang === "pt" ? "PT / EN" : "EN / PT";

  document.getElementById("page-title").textContent = T.site.nome + " — Product Designer";
  const desc = lang === "pt"
    ? "Product Designer especialista em SaaS B2B, Design Systems e Discovery de produto. Baseada em Recife, Brasil."
    : "Product Designer specializing in B2B SaaS, Design Systems, and product Discovery. Based in Recife, Brazil.";
  document.getElementById("meta-description").content = desc;
  document.getElementById("og-title").content = T.site.nome + " — Product Designer";
  document.getElementById("og-description").content = desc;
  document.getElementById("twitter-title").content = T.site.nome + " — Product Designer";
  document.getElementById("twitter-description").content = desc;
  document.getElementById("og-locale").content = lang === "pt" ? "pt_BR" : "en_US";

  document.getElementById("brand-name").textContent = T.site.nome;
  document.getElementById("footer-name").innerHTML = "© <span id='footer-year'></span> " + T.site.nome;
  document.getElementById("footer-year").textContent = new Date().getFullYear();
  document.getElementById("footer-local").textContent = T.ui.footer.local;

  document.getElementById("nav-cases").textContent = T.ui.nav.cases;
  document.getElementById("nav-sobre").textContent = T.ui.nav.sobre;
  document.getElementById("nav-contato").textContent = T.ui.nav.contato;
  document.getElementById("nav-cases-mobile").textContent = T.ui.nav.cases;
  document.getElementById("nav-sobre-mobile").textContent = T.ui.nav.sobre;
  document.getElementById("nav-contato-mobile").textContent = T.ui.nav.contato;
  document.getElementById("resume-link").textContent = T.ui.nav.curriculo;
  document.getElementById("resume-link-mobile").textContent = T.ui.nav.curriculo;
  document.getElementById("resume-link").href = T.site.resume;
  document.getElementById("resume-link-mobile").href = T.site.resume;

  document.getElementById("hero-status").textContent = T.hero.status;
  document.getElementById("hero-headline").textContent = T.hero.headline;
  document.getElementById("hero-currently").textContent = T.hero.atualmente;
  document.getElementById("hero-delivering").textContent = T.hero.entregando;
  document.getElementById("hero-linkedin").href = T.site.linkedin;
  document.getElementById("hero-linkedin").setAttribute("aria-label", T.ui.aria.linkedin);
  document.getElementById("hero-cta-label").textContent = T.ui.misc.verCases;

  document.getElementById("contact-linkedin").href = T.site.linkedin;
  document.getElementById("contact-linkedin").setAttribute("aria-label", T.ui.aria.linkedin);
  document.getElementById("contact-whatsapp").href = T.site.whatsapp;
  document.getElementById("contact-whatsapp").setAttribute("aria-label", T.ui.aria.whatsapp);
  document.getElementById("contact-email").href = "mailto:" + T.site.email;
  document.getElementById("contact-email-label").textContent = T.contact.botao;
  document.getElementById("contact-headline").textContent = T.contact.headline;
  document.getElementById("cases-headline").textContent = T.casesSectionHeadline;

  document.getElementById("sobre-eyebrow").textContent = T.ui.nav.sobre;
  document.getElementById("cases-eyebrow").textContent = T.ui.nav.cases;
  document.getElementById("contato-eyebrow").textContent = T.ui.nav.contato;

  document.getElementById("theme-toggle").setAttribute("aria-label", T.ui.aria.tema);
  document.getElementById("nav-toggle").setAttribute("aria-label", T.ui.aria.menu);
  document.getElementById("lang-toggle").setAttribute("aria-label", T.ui.aria.idioma);

  document.getElementById("about-headline").textContent = T.about.headline;
  const aboutP = document.getElementById("about-paragraphs");
  aboutP.innerHTML = "";
  T.about.paragrafos.forEach(p => {
    const el = document.createElement("p");
    el.textContent = p;
    aboutP.appendChild(el);
  });
  const principlesEl = document.getElementById("about-principles");
  principlesEl.innerHTML = "";
  T.about.principios.forEach(p => {
    const div = document.createElement("div");
    div.className = "principle";
    div.innerHTML = "<div class='t'>" + p.titulo + "</div><div class='d'>" + p.descricao + "</div>";
    principlesEl.appendChild(div);
  });

  const caseListEl = document.getElementById("case-list");
  caseListEl.innerHTML = "";
  T.cases.forEach(c => {
    const a = document.createElement("a");
    a.className = "case-panel";
    a.href = "case.html?slug=" + encodeURIComponent(c.slug) + "&lang=" + lang;
    const tagsHtml = (c.tags || []).map(t => "<span class='case-tag'>" + t + "</span>").join("");
    const visualHtml = c.capa
      ? "<img class='case-frame-img' src='" + c.capa + "' alt='" + c.title + "'>"
      : "<div class='case-frame'>" + T.ui.misc.printFigma + "</div>";
    a.innerHTML =
      "<div class='case-panel-text'>" +
        "<div class='case-tags'>" + tagsHtml + "</div>" +
        "<h3>" + c.title + "</h3>" +
        "<p class='line'>" + c.oneLiner + "</p>" +
        "<span class='go'>" + T.ui.misc.verCaseCompleto + "</span>" +
      "</div>" +
      "<div class='case-panel-visual'>" +
        "<div class='case-glow'></div>" +
        visualHtml +
      "</div>";
    caseListEl.appendChild(a);
  });
}

let currentLang = getLang();
render(currentLang);

document.getElementById("lang-toggle").addEventListener("click", function () {
  currentLang = currentLang === "pt" ? "en" : "pt";
  setLang(currentLang);
  render(currentLang);
});
</script>
</body>
</html>
